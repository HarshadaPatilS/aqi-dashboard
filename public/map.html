<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map View - AQI Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <span class="nav-icon">🌍</span>
                <span class="nav-title">AQI Dashboard</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="compare.html">Compare</a></li>
                <li><a href="map.html" class="active">Map</a></li>
                <li><a href="insights.html">Insights</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </div>
    </nav>

    <!-- Map Header with Search -->
    <section class="map-header">
        <div class="container">
            <h1>Interactive AQI Map</h1>
            <div class="map-controls">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="mapSearch" 
                        class="search-input" 
                        placeholder="Search location on map..."
                        autocomplete="off"
                    >
                    <button id="searchMapBtn" class="search-btn">Search</button>
                </div>
                <div id="mapAutocomplete" class="autocomplete-results"></div>
            </div>
        </div>
    </section>

    <!-- Map Container -->
    <section class="map-section">
        <div class="container-fluid">
            <div id="map" class="map-container"></div>
            
            <!-- Map Legend -->
            <div class="map-legend">
                <h4>AQI Scale</h4>
                <div class="legend-item">
                    <span class="legend-color" style="background: #00e400;"></span>
                    <span>Good (1)</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color" style="background: #ffff00;"></span>
                    <span>Fair (2)</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color" style="background: #ff7e00;"></span>
                    <span>Moderate (3)</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color" style="background: #ff0000;"></span>
                    <span>Poor (4)</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color" style="background: #8f3f97;"></span>
                    <span>Very Poor (5)</span>
                </div>
            </div>

            <!-- City Detail Panel -->
            <div id="cityPanel" class="city-panel" style="display: none;">
                <button class="panel-close" onclick="closeCityPanel()">×</button>
                <h3 id="panelCityName">City Name</h3>
                <div class="panel-aqi">
                    <div class="panel-aqi-value" id="panelAQI">--</div>
                    <div class="panel-aqi-label" id="panelLabel">Loading...</div>
                </div>
                <div id="panelPollutants" class="panel-pollutants"></div>
                <button class="panel-btn" onclick="viewCityDetails()">View Full Dashboard</button>
            </div>
        </div>
    </section>

    <script src="app.js"></script>
    <script src="map.js"></script>
</body>
</html>
