<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Cities - AQI Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <span class="nav-icon">🌍</span>
                <span class="nav-title">AQI Dashboard</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="compare.html" class="active">Compare</a></li>
                <li><a href="map.html">Map</a></li>
                <li><a href="insights.html">Insights</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </div>
    </nav>

    <!-- Compare Header -->
    <section class="page-header">
        <div class="container">
            <h1>Compare Cities</h1>
            <p>Add up to 4 cities to compare their air quality</p>
        </div>
    </section>

    <!-- Add City Search -->
    <section class="add-city-section">
        <div class="container">
            <div class="search-container">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="citySearch" 
                        class="search-input" 
                        placeholder="Add a city to compare..."
                        autocomplete="off"
                    >
                    <button id="searchBtn" class="search-btn">Add</button>
                </div>
                <div id="autocompleteResults" class="autocomplete-results"></div>
            </div>
        </div>
    </section>

    <!-- Comparison Grid -->
    <section class="comparison-section">
        <div class="container">
            <div id="cityCards" class="comparison-grid">
                <div class="empty-state-large">
                    <span class="empty-icon">🏙️</span>
                    <h3>No Cities Added</h3>
                    <p>Search and add cities above to start comparing</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Comparison Charts -->
    <section class="charts-section">
        <div class="container">
            <div id="chartsContainer" class="charts-container" style="display: none;">
                <!-- Radar Chart -->
                <div class="card chart-card">
                    <h2 class="card-title">Pollutants Comparison (Radar)</h2>
                    <div class="chart-container">
                        <canvas id="radarChart"></canvas>
                    </div>
                </div>

                <!-- Grouped Bar Chart -->
                <div class="card chart-card">
                    <h2 class="card-title">AQI Comparison</h2>
                    <div class="chart-container">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="app.js"></script>
    <script src="compare.js"></script>
</body>
</html>
